services:
  - type: web
    name: watch-party
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: PUBLIC_URL
        value: https://watch-party.onrender.com
      - key: PORT
        value: "3000"

