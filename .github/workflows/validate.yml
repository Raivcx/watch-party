name: Validate

on:
  push:
    branches:
      - feat/watch-party-improvements
  pull_request:
    branches:
      - feat/watch-party-platform

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Smoke-test room store
        run: |
          node --input-type=module -e "import { createRoom, getRoom, deleteRoom } from './lib/roomStore.js'; const room = createRoom({ type: 'screenshare', media: {}, hostUserId: 'test-user' }); if (getRoom(room.id)?.hostUserId !== 'test-user') process.exit(1); deleteRoom(room.id); if (getRoom(room.id)) process.exit(1);"
