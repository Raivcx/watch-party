<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f14;
      color: #e8e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    a { color: #5865f2; }
    code {
      background: #1a1a24;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div>
    <h1>📺 Watch Party</h1>
    <p>Use Discord slash commands to create a synced room:</p>
    <ul style="list-style: none; padding: 0; line-height: 2.4;">
      <li><code>/watch url:https://youtu.be/dQw4w9WgXcQ</code> — YouTube video</li>
      <li><code>/watch url:https://vimeo.com/123456789</code> — Vimeo video</li>
      <li><code>/screenshare</code> — Real-time screen sharing (WebRTC)</li>
    </ul>
    <p style="font-size: 13px; color: #8b8ba0; margin-top: 24px;">
      Watch parties are powered by <a href="https://w2g.tv" target="_blank" rel="noopener">Watch2Gether</a>.
    </p>
  </div>
</body>
</html>
