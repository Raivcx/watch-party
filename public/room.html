<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party Room</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">

    <!-- Left: media panel -->
    <div id="media-panel">
      <!-- Room header bar -->
      <div id="room-header">
        <span class="room-icon" id="room-icon">📺</span>
        <span class="room-title" id="room-title">Carregando…</span>
        <span class="room-badge" id="room-badge" style="display:none"></span>
        <div style="flex:1"></div>
        <!-- Header actions (host only, shown via JS) -->
        <div id="header-actions" style="display:none;gap:6px;align-items:center;display:none">
          <button id="transfer-host-btn" class="header-btn" title="Transferir host">👑 Transferir</button>
        </div>
      </div>

      <!-- Media area (injected by room.js) -->
      <div id="media-container"></div>

      <!-- Custom player controls overlay (for screenshare) -->
      <div id="player-controls" style="display:none">
        <button id="btn-share-screen" class="ctrl-btn" title="Compartilhar tela">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Compartilhar Tela
        </button>
        <button id="btn-stop-share" class="ctrl-btn ctrl-danger" title="Parar compartilhamento" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
          Parar
        </button>
        <button id="btn-fullscreen" class="ctrl-btn" title="Fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>

      <!-- Screen share start button (old, hidden — kept for JS compat) -->
      <button id="start-share-btn" style="display:none">Iniciar Screen Share</button>
    </div>

    <!-- Resizable divider between media and right column -->
    <div id="resize-handle" title="Arrastar para redimensionar"></div>

    <!-- Right: chat + members -->
    <div id="right-column">

      <!-- Chat panel -->
      <div id="chat-panel">
        <div id="chat-header">
          <span class="channel-name" id="chat-channel-name">watch-party</span>
          <div class="chat-header-actions">
            <span id="user-count">1 online</span>
            <button id="toggle-members-btn" class="icon-btn" title="Mostrar/ocultar membros">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
          </div>
        </div>

        <div id="chat-messages"></div>

        <div id="typing-area">
          <span id="typing-indicator"></span>
        </div>

        <div id="chat-input-wrapper">
          <div id="chat-input-box">
            <input
              id="chat-input"
              placeholder="Enviar mensagem…"
              maxlength="500"
              autocomplete="off"
            >
            <button id="send-btn" class="send-btn" title="Enviar">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Members panel -->
      <div id="members-panel">
        <!-- Drag handle on left edge to resize -->
        <div id="members-resize-handle" title="Arrastar para redimensionar"></div>
        <!-- Collapse toggle -->
        <button id="members-collapse-btn" title="Retrair/expandir membros">‹</button>
        <div class="members-group-label">Online — <span id="members-count">0</span></div>
        <div id="members-list"></div>
      </div>

    </div>
  </div>

  <!-- Transfer host modal -->
  <div id="transfer-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3>Transferir Host</h3>
      <p>Escolha quem vai assumir o controle da sala:</p>
      <div id="transfer-list"></div>
      <div class="modal-actions">
        <button id="transfer-cancel-btn" class="btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay">
    <div id="error-box">
      <h1>Sala Indisponível</h1>
      <p id="error-text">Esta sala não existe ou expirou.</p>
    </div>
  </div>

  <!-- Kicked overlay -->
  <div id="kicked-overlay">
    <div id="kicked-box">
      <h2>Você foi removido</h2>
      <p id="kicked-text">O host removeu você desta sala.</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
