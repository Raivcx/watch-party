<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party Room</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">

    <!-- Left: media panel -->
    <div id="media-panel">
      <!-- Room header bar -->
      <div id="room-header">
        <span class="room-icon" id="room-icon">📺</span>
        <span class="room-title" id="room-title">Carregando…</span>
        <span class="room-badge" id="room-badge" style="display:none"></span>
      </div>

      <!-- Media area (injected by room.js) -->
      <div id="media-container"></div>

      <!-- Screen share start button -->
      <button id="start-share-btn" style="display:none">Iniciar Screen Share</button>
    </div>

    <!-- Right: chat + members -->
    <div id="right-column">

      <!-- Chat panel -->
      <div id="chat-panel">
        <div id="chat-header">
          <span class="channel-name" id="chat-channel-name">watch-party</span>
          <span id="user-count">1 online</span>
        </div>

        <div id="chat-messages"></div>

        <div id="typing-area">
          <span id="typing-indicator"></span>
        </div>

        <div id="chat-input-wrapper">
          <div id="chat-input-box">
            <input
              id="chat-input"
              placeholder="Enviar mensagem…"
              maxlength="500"
              autocomplete="off"
            >
          </div>
        </div>
      </div>

      <!-- Members panel -->
      <div id="members-panel">
        <div class="members-group-label">Online</div>
        <div id="members-list"></div>
      </div>

    </div>
  </div>

  <!-- Error overlay -->
  <div id="error-overlay">
    <div id="error-box">
      <h1>Sala Indisponível</h1>
      <p id="error-text">Esta sala não existe ou expirou.</p>
    </div>
  </div>

  <!-- Kicked overlay -->
  <div id="kicked-overlay">
    <div id="kicked-box">
      <h2>Você foi removido</h2>
      <p id="kicked-text">O host removeu você desta sala.</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
