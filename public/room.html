<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party Room</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">

    <!-- ── Media panel ─────────────────────────────────────── -->
    <div id="media-panel">

      <div id="room-header">
        <span class="room-icon" id="room-icon">🖥️</span>
        <span class="room-title" id="room-title">Carregando…</span>
        <span class="room-badge" id="room-badge" style="display:none"></span>
        <div class="room-header-spacer"></div>
        <div id="header-actions" class="header-actions">
          <button id="transfer-host-btn" class="header-btn" title="Transferir host">
            <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            Transferir Host
          </button>
        </div>
      </div>

      <div id="media-container"></div>

      
      <!-- Queue panel (YouTube playlist only, shown via JS) -->
      <div id="queue-panel" style="display:none">
        <div id="queue-header">
          <span id="queue-title">▶ Fila</span>
          <span id="queue-count"></span>
        </div>
        <div id="queue-list"></div>
        <div id="queue-add-form">
          <input id="queue-add-input" placeholder="Adicionar vídeo (link ou ID)…" autocomplete="off">
          <button id="queue-add-btn" title="Adicionar à fila">+</button>
        </div>
      </div>
<div id="player-controls">
        <div id="ctrl-share-group" style="display:none">
          <button id="btn-share-screen" class="ctrl-btn ctrl-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            Compartilhar Tela
          </button>
          <button id="btn-stop-share" class="ctrl-btn ctrl-danger" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            Parar
          </button>
        </div>
        <div id="ctrl-viewer-waiting" style="display:none">
          <span class="ctrl-status">
            <span class="ctrl-dot"></span>
            Aguardando transmissão…
          </span>
        </div>
        <div id="ctrl-viewer-receiving" style="display:none">
          <span class="ctrl-status ctrl-status-live">
            <span class="ctrl-dot ctrl-dot-live"></span>
            Ao vivo
          </span>
        </div>
        <div class="ctrl-spacer"></div>
        <button id="btn-fullscreen" class="ctrl-btn ctrl-icon" title="Tela cheia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </div>

    <!-- Resize handle -->
    <div id="resize-handle" title="Arrastar para redimensionar"></div>

    <!-- ── Right column ─────────────────────────────────────── -->
    <div id="right-column">

      <!-- Chat panel -->
      <div id="chat-panel">

        <div id="chat-header">
          <div class="chat-header-left">
            <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" style="color:var(--v-text-3);flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="channel-name" id="chat-channel-name">watch-party</span>
          </div>
          <div class="chat-header-right">
            <span id="user-count" class="user-count-badge">1</span>
            <button id="toggle-members-btn" class="icon-btn active" title="Fechar painel de membros">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/><path d="M9 9l3 3-3 3"/></svg>
            </button>
          </div>
        </div>

        <div id="chat-messages"></div>

        <div id="typing-area">
          <span id="typing-indicator"></span>
        </div>

        <div id="chat-input-wrapper">
          <div id="chat-input-box">
            <input id="chat-input" placeholder="Enviar mensagem…" maxlength="500" autocomplete="off">
            <button id="send-btn" class="send-btn" title="Enviar">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Members panel -->
      <div id="members-panel">
        <div id="members-resize-handle" title="Redimensionar"></div>

        <div id="members-header">
          <span id="members-title">
            <svg viewBox="0 0 24 24" fill="currentColor" width="11" height="11" style="opacity:.5;flex-shrink:0"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Online — <span id="members-count">0</span>
          </span>
          <button id="members-collapse-btn" title="Retrair/expandir">
            <svg id="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>

        <div id="members-list"></div>
      </div>

    </div>
  </div>

  <!-- Transfer host modal -->
  <div id="transfer-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Transferir Host</h3>
        <button id="transfer-cancel-btn" class="icon-btn" style="margin-left:auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p>Escolha quem vai assumir o controle da sala:</p>
      <div id="transfer-list"></div>
    </div>
  </div>

  <div id="error-overlay"><div id="error-box"><h1>Sala Indisponível</h1><p id="error-text">Esta sala não existe ou expirou.</p></div></div>
  <div id="kicked-overlay"><div id="kicked-box"><h2>Você foi removido</h2><p id="kicked-text">O host removeu você desta sala.</p></div></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
