<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Party Room</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <div id="media-panel">
      <div id="media-container">
        <!-- Injetado pelo room.js: iframe VidSrc, YT player, ou vídeo WebRTC -->
      </div>
      <button id="start-share-btn" style="display:none">Iniciar Screen Share</button>
    </div>

    <div id="chat-panel">
      <div id="chat-header">
        <h2>Watch Party Chat</h2>
        <span id="user-count">1 online</span>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" placeholder="Digite uma mensagem…" maxlength="500">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>

  <div id="error-overlay">
    <div id="error-box">
      <h1>Sala Indisponível</h1>
      <p id="error-text">Esta sala não existe ou expirou.</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
