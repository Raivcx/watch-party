<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <title>Watch Party</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <main id="media-panel">
      <header id="room-toolbar">
        <a class="brand" href="/">WATCH PARTY</a>
        <div class="room-user">
          <img id="user-avatar" alt="" hidden>
          <span id="user-name">Conectando...</span>
          <a href="/auth/logout" class="logout-link">Sair</a>
        </div>
      </header>
      <div id="media-container" aria-live="polite"></div>
      <button id="start-share-btn" type="button" style="display:none">Iniciar compartilhamento</button>
    </main>
    <aside id="chat-panel">
      <div id="chat-header"><h2>Atividade da sala</h2><span id="user-count">0 online</span></div>
      <div id="chat-messages" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" placeholder="Digite uma mensagem…" maxlength="500" aria-label="Mensagem">
        <button type="submit">Enviar</button>
      </form>
    </aside>
  </div>
  <div id="error-overlay" role="alert" aria-live="assertive">
    <div id="error-box"><h1>Sala indisponível</h1><p id="error-text">Esta sala não existe ou expirou.</p><a href="/">Voltar ao início</a></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/room.js"></script>
</body>
</html>
